plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kingdomlife.tabremote'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kingdomlife.tabremote'
        minSdk 19          // Galaxy Tab 4 7.0 shipped with Android 4.4 KitKat
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    // Fixed signing key kept in the repo, so new builds install over old ones
    signingConfigs {
        fixed {
            storeFile file('tabremote.keystore')
            storePassword 'tabremote'
            keyAlias 'tabremote'
            keyPassword 'tabremote'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
